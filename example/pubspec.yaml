name: flutter_pixel_ui_example
description: Пример использования flutter_pixel_ui.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_pixel_canvas:
    path: ../../flutter_pixel_canvas
  flutter_pixel_ui:
    path: ../

# Пример всегда берёт холст из соседней папки, даже когда сам flutter_pixel_ui
# подключает его с GitHub (иначе pub видит два разных источника одного пакета).
dependency_overrides:
  flutter_pixel_canvas:
    path: ../../flutter_pixel_canvas

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/atlas.json
    - assets/atlas.png
